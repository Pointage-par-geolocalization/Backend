services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pointage
      POSTGRES_USER: pointage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    # Développement local uniquement : supprimer cette publication en production.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pointage -d pointage"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pointage:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/pointage
      FRONTEND_ORIGINS: http://localhost:5173
      AUTO_CREATE_SCHEMA: "false"
      RUN_MIGRATIONS: "true"
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
